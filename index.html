---
layout: default
title: Home
---

{% include intro.html %}

<section class="post-list">
  <div class="container">
    {% assign post_years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
    {% for year in post_years %}
      <section class="news-year" aria-labelledby="year-{{ year.name }}">
        <h2 class="news-year-label" id="year-{{ year.name }}">{{ year.name }}</h2>
        <div class="news-entries">
          {% for post in year.items %}
            <article class="news-entry">
              <time class="news-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %d" }}</time>
              <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </article>
          {% endfor %}
        </div>
      </section>
    {% endfor %}
  </div>
</section>
